services:
  room-rentals-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=80
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-80}:80'
    volumes:
      - '.:/var/www/html'
    depends_on:
      - mysql
      - mailpit

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: php artisan queue:work --verbose --tries=1 --timeout=0
    volumes:
      - '.:/var/www/html'
    depends_on:
      - mysql
      - mailpit

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - '${REVERB_PORT:-8080}:8080'
    volumes:
      - '.:/var/www/html'
    depends_on:
      - mysql
      - mailpit

  vite:
    image: node:20-alpine
    working_dir: /var/www/html
    entrypoint: ["sh", "-lc"]
    command:
      - "npm install && npm run dev -- --host 0.0.0.0 --port ${VITE_PORT:-5173}"
    ports:
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    volumes:
      - '.:/var/www/html'
    depends_on:
      - room-rentals-app

  mysql:
    image: mysql:8.0
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-room-rentals}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE:-room-rentals}'
      MYSQL_USER: '${DB_USERNAME:-room-rentals}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-room-rentals}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - 'sail-mysql:/var/lib/mysql'
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-p${DB_PASSWORD:-room-rentals}'
      retries: 5
      timeout: 5s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'

volumes:
  sail-mysql:
    driver: local
